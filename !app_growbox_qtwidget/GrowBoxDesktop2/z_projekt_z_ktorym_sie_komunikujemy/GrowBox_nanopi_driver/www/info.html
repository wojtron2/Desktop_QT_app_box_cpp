<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Growbox NanoPi httplib server</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      /* wycentrowanie na ekranie */
      height: 100%;
	  margin: 0;
	  display: flex;
	  justify-content: center;   /* dalej na srodku w poziomie */
	  align-items: flex-start;   /* na gorze w pionie */
	  padding-top: 40px;         /* odstep od samej krawedzi */
	  font-family: sans-serif;
	  background: #f5f5f5;
    }

    .box {
      width: 50%;                 /* pol ekranu */
      border: 3px solid #2e7d32;  /* zielona ramka */
      border-radius: 8px;
      padding: 20px;
      background: #ffffff;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    pre {
      background: #111;
      color: #0f0;
      padding: 10px;
      border-radius: 4px;
      overflow: auto;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>Growbox NanoPi libmicrohttpd server</h1>
  <p>Strona glowna serwera HTTP Growbox</p>
  <p>/api/status/ JSON response:</p>
  <pre id="out"></pre>
</div>

<script>
  fetch('/api/status')
    .then(r => r.json())
    .then(j => {
      document.getElementById('out').textContent =
        JSON.stringify(j, null, 2);
    })
    .catch(e => {
      document.getElementById('out').textContent = 'Error: ' + e;
    });
</script>

</body>
</html>
