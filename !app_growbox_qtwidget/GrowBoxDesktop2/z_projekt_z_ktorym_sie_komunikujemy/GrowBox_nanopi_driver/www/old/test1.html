<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>httplib test</title>
</head>
<body>
  <h1>Serwer dziala</h1>
  <pre id="status">...</pre>

  <script>
    fetch('/status')
      .then(r => r.json())
      .then(d => {
        document.getElementById('status').innerText =
          JSON.stringify(d, null, 2);
      });
  </script>
</body>
</html>
