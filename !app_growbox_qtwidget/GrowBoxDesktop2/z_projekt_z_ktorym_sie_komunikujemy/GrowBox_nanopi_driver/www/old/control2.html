<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Growbox Control Panel</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    margin: 20px;
}

h1 {
    margin-bottom: 15px;
}

button {
    padding: 6px 10px;
    margin: 3px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.btn-on      { background: #22c55e; }
.btn-off     { background: #ef4444; }
.btn-manual  { background: #f59e0b; }
.btn-auto    { background: #3b82f6; }
.btn-global  { background: #8b5cf6; }

.card {
    background: #1e293b;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

input[type="number"] {
    width: 60px;
    padding: 3px;
}

.state-on  { color: #22c55e; font-weight: bold; }
.state-off { color: #ef4444; font-weight: bold; }
</style>
</head>

<body>

<h1>Growbox Control Panel</h1>

<div class="card">
    <button class="btn-global" onclick="setGlobalAuto(true)">Global AUTO ON</button>
    <button class="btn-global" onclick="setGlobalAuto(false)">Global AUTO OFF</button>
    <span id="globalStatus"></span>
</div>

<div class="grid" id="outputs"></div>

<script>

async function api(url) {
    const res = await fetch(url);
    return await res.json();
}

async function refresh() {

    const data = await api("/api/status");

    document.getElementById("globalStatus").innerText =
        "Global AUTO: " + (data.globalAutoMode ? "ON" : "OFF");

    const container = document.getElementById("outputs");
    container.innerHTML = "";

    data.outputs.forEach(o => {

        const div = document.createElement("div");
        div.className = "card";

        const stateClass = o.state ? "state-on" : "state-off";

        div.innerHTML = `
            <h3>Output ${o.id}</h3>

            <div>State: <span class="${stateClass}">
                ${o.state ? "ON" : "OFF"}
            </span></div>

            <div>Manual Mode: <b>${o.manualMode ? "ON" : "OFF"}</b></div>

            <div>Auto ON Hour: ${o.autoOnHour}</div>
            <div>Auto OFF Hour: ${o.autoOffHour}</div>

            <div>
                <button class="btn-on"  onclick="setOn(${o.id})">ON</button>
                <button class="btn-off" onclick="setOff(${o.id})">OFF</button>
            </div>

            <div>
                <button class="btn-manual" onclick="setManual(${o.id}, true)">
                    Manual ON
                </button>

                <button class="btn-auto" onclick="setManual(${o.id}, false)">
                    Manual OFF
                </button>
            </div>

            <div>
                <input type="number" min="0" max="23" id="on${o.id}" placeholder="ON hour">
                <button onclick="setAutoOn(${o.id})">Set ON</button>
            </div>

            <div>
                <input type="number" min="0" max="23" id="off${o.id}" placeholder="OFF hour">
                <button onclick="setAutoOff(${o.id})">Set OFF</button>
            </div>
        `;

        container.appendChild(div);
    });
}

// ===== API CALLS =====

function setOn(id) {
    api(`/api/output/${id}/on`).then(refresh);
}

function setOff(id) {
    api(`/api/output/${id}/off`).then(refresh);
}

function setManual(id, enabled) {
    const mode = enabled ? "on" : "off";
    api(`/api/output/${id}/manual/${mode}`).then(refresh);
}

function setAutoOn(id) {
    const hour = document.getElementById("on" + id).value;
    if (hour === "") return;
    api(`/api/output/${id}/autoon?hour=${hour}`).then(refresh);
}

function setAutoOff(id) {
    const hour = document.getElementById("off" + id).value;
    if (hour === "") return;
    api(`/api/output/${id}/autooff?hour=${hour}`).then(refresh);
}

function setGlobalAuto(enabled) {
    const mode = enabled ? "on" : "off";
    api(`/api/system/auto/${mode}`).then(refresh);
}

// ===== INIT =====

refresh();
setInterval(refresh, 5000);

</script>

</body>
</html>
